<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.row{
  width: 960px;
  margin: 0px auto;
}
p {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
</style>
</head>
<body>
  <div class="container">
   <div class="row">
    <div class="col-sm-3" th:each="vo:${list}">
      <a href="#">
       <div class="thumbnail">
         <img th:src="${vo.poster}" th:title="${vo.address}" 
           style="width: 250px;height: 150px;object-fit:cover">
         <p>[[${vo.name}]]</p>
       </div>
      </a>
    </div>
   </div>
   <div class="row text-center" style="margin-top: 10px">
     <ul class="pagination">
       <li th:if="${startPage>1}"><a th:href="@{/(page=${startPage-1})}">&laquo;</a></li>
       <li th:each="i:${#numbers.sequence(startPage,endPage)}"
       th:class="${i==curpage?'active':''}">
        <a th:href="@{/(page=${i})}">[[${i}]]</a>
       </li>
       <li th:if="${endPage<totalpage}"><a th:href="@{/(page=${endPage+1})}">&raquo;</a></li>
     </ul>
   </div>
  </div>
</body>
</html>
